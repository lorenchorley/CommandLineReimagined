<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CommandLineReimagined</title>
<base href="/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%96%B8%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#12131a; --panel:#1b1d27; --line:#2a2d3a; --fg:#e6e6ef; --dim:#8a8ba3;
    --ok:#4ade80; --bad:#f87171; --accent:#6b8afd;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f7f7fb; --panel:#fff; --line:#e2e3ec; --fg:#1a1b23; --dim:#63657a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  header { flex:none; margin-bottom:10px; }
  h1 { font-size:15px; margin:0; }
  .sub { color:var(--dim); font-size:12px; margin:2px 0 0; }
  .status { float:right; font-size:12px; }
  #cmd {
    width:100%; font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:12px; border-radius:10px; border:1px solid var(--line);
    background:var(--panel); color:var(--fg);
  }
  #cmd:disabled { opacity:.5; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0; flex:none; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    flex:none; font:12px ui-monospace,monospace; padding:6px 10px; border-radius:999px;
    border:1px solid var(--line); background:var(--panel); color:var(--dim); white-space:nowrap;
  }
  #stage { flex:1; min-height:120px; position:relative; }
  canvas { width:100%; height:100%; display:block; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
  #detail {
    flex:none; margin-top:10px; padding:10px 12px; border-radius:10px;
    background:var(--panel); border:1px solid var(--line); font-size:12px; min-height:56px;
  }
  .muted { color:var(--dim); } .err { color:var(--bad); }
</style>
</head>
<body>
  <header>
    <span class="status" id="status">booting .NET…</span>
    <h1>CommandLineReimagined</h1>
    <p class="sub">The GOLD grammar, compiled to WebAssembly. Tap any token.</p>
  </header>

  <input id="cmd" value="command -with optionalParameter" disabled
         autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false">

  <div class="chips" id="chips"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="detail"><span class="muted">Loading the parser…</span></div>

<script src="_framework/blazor.webassembly.js" autostart="true"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

const EXAMPLES = [
  'command -with optionalParameter',
  'command(with: optionalParameter)',
  'command() | anotherCommand()',
  '<objInstance attr=value/>',
  '<variableName|objInstance></>',
  'command | <objInstance><child val=$v/></objInstance>',
  'echo "hello world"',
  'cd /tmp',
];

const PALETTES = {
  dark:  { command:'#7aa2f7', flag:'#e0af68', string:'#9ece6a', variable:'#bb9af7',
           identifier:'#c0caf5', type:'#2ac3de', attribute:'#ff9e64',
           punctuation:'#565f89', whitespace:'transparent', newline:'transparent' },
  light: { command:'#2f5fd0', flag:'#a35a00', string:'#2d7a2d', variable:'#7132b8',
           identifier:'#1a1b23', type:'#0b6e86', attribute:'#a34a00',
           punctuation:'#8b8fa3', whitespace:'transparent', newline:'transparent' },
};
const isDark = () => matchMedia('(prefers-color-scheme: dark)').matches;
let palette = isDark() ? PALETTES.dark : PALETTES.light;

let tokens = [], parseError = null, boxes = [], selected = -1, ready = false;

const FONT_PX = 16, LINE_H = 26, PAD = 14;

// Records a rect per token while drawing. These are the browser-side equivalent of
// Renderer.CanvasRenderPosition, which is what RayCaster hit-tests in the desktop app.
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.font = FONT_PX + 'px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
  ctx.textBaseline = 'middle';
  boxes = [];

  const css = getComputedStyle(document.body);

  if (!ready) {
    ctx.fillStyle = css.getPropertyValue('--dim');
    ctx.fillText('starting the .NET runtime…', PAD, PAD + LINE_H / 2);
    return;
  }

  if (parseError) {
    ctx.fillStyle = css.getPropertyValue('--bad');
    ctx.fillText('parse error at column ' + parseError.column, PAD, PAD + LINE_H / 2);
    ctx.fillStyle = css.getPropertyValue('--dim');
    wrapText('expected: ' + parseError.expected.join(' '), PAD, PAD + LINE_H * 1.6, w - PAD * 2);
    return;
  }

  let x = PAD, y = PAD + LINE_H / 2;
  tokens.forEach((t, i) => {
    if (t.kind === 'newline') { x = PAD; y += LINE_H; return; }
    const tw = ctx.measureText(t.text).width;
    if (x + tw > w - PAD && x > PAD) { x = PAD; y += LINE_H; }
    boxes.push({ i, x, y: y - LINE_H / 2, w: tw, h: LINE_H });
    if (i === selected) {
      ctx.fillStyle = isDark() ? 'rgba(107,138,253,.25)' : 'rgba(107,138,253,.18)';
      ctx.fillRect(x - 2, y - LINE_H / 2, tw + 4, LINE_H);
    }
    ctx.fillStyle = palette[t.kind] || palette.identifier;
    ctx.fillText(t.text, x, y);
    x += tw;
  });

  if (!tokens.length) {
    ctx.fillStyle = css.getPropertyValue('--dim');
    ctx.fillText('(empty command)', PAD, y);
  }
}

function wrapText(text, x, y, maxW) {
  let line = '';
  for (const word of text.split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += LINE_H * 0.8; line = word; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}

cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const hit = boxes.find(b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h);
  selected = hit ? hit.i : -1;
  showDetail(); draw();
});

function showDetail() {
  if (parseError) {
    $('detail').innerHTML = '<span class="err">' + parseError.kind + ' error</span> at column <b>' +
      parseError.column + '</b><br><span class="muted">expected: ' + parseError.expected.join(', ') + '</span>';
    return;
  }
  if (selected < 0) {
    const kinds = [...new Set(tokens.filter(t => t.kind !== 'whitespace').map(t => t.kind))];
    $('detail').innerHTML = '<span class="muted">' + tokens.length + ' tokens · ' +
      kinds.map(k => '<span style="color:' + (palette[k] || '') + '">' + k + '</span>').join(' ') + '</span>';
    return;
  }
  const t = tokens[selected];
  $('detail').innerHTML = '<b style="color:' + (palette[t.kind] || '') + '">' + t.kind + '</b> — <b>' +
    t.text.replace(/</g, '&lt;') + '</b><br><span class="muted">assigned by the grammar, not by pattern matching</span>';
}

function parse() {
  if (!ready) return;
  let d;
  try {
    d = JSON.parse(DotNet.invokeMethod('WebClient', 'Parse', $('cmd').value));
  } catch (e) {
    $('detail').innerHTML = '<span class="err">parser call failed</span> <span class="muted">' + e + '</span>';
    return;
  }
  tokens = d.tokens || []; parseError = d.error; selected = -1;
  showDetail(); draw();
}

let timer = null;
$('cmd').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(parse, 60); });

EXAMPLES.forEach(ex => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = ex;
  b.onclick = () => { $('cmd').value = ex; parse(); };
  $('chips').appendChild(b);
});

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  palette = isDark() ? PALETTES.dark : PALETTES.light; showDetail(); draw();
});
addEventListener('resize', draw);

// blazor.webassembly.js boots asynchronously; DotNet.invokeMethod only exists once the
// runtime is up, so poll rather than racing it.
(function waitForRuntime(attempt) {
  if (window.DotNet && typeof DotNet.invokeMethod === 'function') {
    try {
      DotNet.invokeMethod('WebClient', 'Parse', '');
    } catch {
      if (attempt < 300) return setTimeout(() => waitForRuntime(attempt + 1), 100);
    }
    ready = true;
    $('cmd').disabled = false;
    $('status').innerHTML = '<span style="color:var(--ok)">wasm</span>';
    parse();
    return;
  }
  if (attempt < 300) setTimeout(() => waitForRuntime(attempt + 1), 100);
  else { $('status').innerHTML = '<span style="color:var(--bad)">failed to load</span>'; draw(); }
})(0);

draw();
</script>
</body>
</html>

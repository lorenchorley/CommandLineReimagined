<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CommandLineReimagined</title>
<base href="/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%96%B8%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#12131a; --panel:#1b1d27; --line:#2a2d3a; --fg:#e6e6ef; --dim:#8a8ba3;
    --ok:#4ade80; --bad:#f87171; --accent:#6b8afd;
    --command:#7aa2f7; --flag:#e0af68; --string:#9ece6a; --variable:#bb9af7;
    --identifier:#c0caf5; --type:#2ac3de; --attribute:#ff9e64; --punctuation:#565f89;
    --operator:#f7768e; --member:#7dcfff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f7f7fb; --panel:#fff; --line:#e2e3ec; --fg:#1a1b23; --dim:#63657a;
      --command:#2f5fd0; --flag:#a35a00; --string:#2d7a2d; --variable:#7132b8;
      --identifier:#1a1b23; --type:#0b6e86; --attribute:#a34a00; --punctuation:#8b8fa3;
      --operator:#b1004a; --member:#0b5d86;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%; overflow:hidden;
  }

  header { flex:none; display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  h1 { font-size:14px; margin:0; flex:1; }
  .status { font-size:11px; color:var(--dim); }

  /* Scrollback ------------------------------------------------------------ */
  #scroll {
    flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px; min-height:0;
  }
  .entry { margin-bottom:10px; }
  .entry:last-child { margin-bottom:0; }
  .echo { white-space:pre-wrap; word-break:break-word; }
  .echo .sigil { color:var(--dim); }
  .out { white-space:pre-wrap; word-break:break-word; color:var(--fg); opacity:.85; }
  .err { color:var(--bad); white-space:pre-wrap; word-break:break-word; }
  .warn {
    color:var(--flag); border:1px solid var(--flag); border-radius:4px;
    padding:0 4px; font-size:10px; cursor:help;
  }
  .kind {
    display:inline-block; font-size:10px; text-transform:lowercase; letter-spacing:.03em;
    border:1px solid var(--bad); border-radius:4px; padding:0 4px; margin-right:6px;
    opacity:.8; vertical-align:1px;
  }
  .hint { color:var(--dim); }

  /* Result chips ---------------------------------------------------------- */
  .items { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  /*
    44 pixels tall. A result chip is a tap target on a phone, and 4px of padding made
    one about 20 pixels, which is half of what a finger can reliably hit.
  */
  .item {
    font:12px ui-monospace,monospace; padding:12px 12px; border-radius:6px;
    border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer;
    min-height:44px;
  }
  .item.folder { color:var(--type); }
  .item.file { color:var(--identifier); }
  .item.object, .item.component, .item.variable { color:var(--variable); }
  .item.number, .item.boolean { color:var(--flag); }
  /* Text results (cat, echo) read as a block, not as a chip to insert. */
  .text { white-space:pre-wrap; word-break:break-word; margin-top:4px; padding:6px 8px;
          border-left:2px solid var(--line); color:var(--fg); }

  /* Tables ---------------------------------------------------------------- */
  /*
    A wide table scrolls sideways inside its own entry rather than widening the page:
    at 390 pixels a listing with six columns does not fit, and a page that scrolls
    horizontally as a whole is unusable on a phone.
  */
  .grid { margin-top:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .grid table { border-collapse:collapse; font:12px ui-monospace,monospace; }
  .grid th, .grid td { text-align:left; padding:8px 10px; white-space:nowrap;
                       border-bottom:1px solid var(--line); }
  .grid th {
    color:var(--dim); font-weight:600; cursor:pointer; position:sticky; top:0;
    background:var(--panel); user-select:none; min-height:44px;
  }
  .grid th::after { content:''; color:var(--accent); }
  .grid th.asc::after { content:' ▲'; }
  .grid th.desc::after { content:' ▼'; }
  .grid tr:last-child td { border-bottom:none; }
  /* A cell is a tap target like a chip, so a listing stays something you drive by touch. */
  .grid td { cursor:pointer; min-height:44px; height:44px; }
  .grid td.folder { color:var(--type); }
  .grid td.file { color:var(--identifier); }
  .grid td.number, .grid td.boolean { color:var(--flag); }
  .grid td.object, .grid td.table { color:var(--variable); }
  .grid td.none { color:var(--punctuation); }
  .grid td.none::before { content:'—'; }
  /*
    A live listing. The badge says the table is being kept up to date and is the way to
    stop it; the flash is how a table that changed under you says that it did, which a
    silent redraw could not.
  */
  .watch:empty { display:none; }
  .watch { margin-top:4px; }
  .watch .badge {
    font:11px ui-monospace,monospace; padding:6px 10px; border-radius:6px; min-height:28px;
    border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer;
  }
  .watch .badge.on { color:var(--ok); border-color:var(--ok); }
  .watch .frozen { font-size:11px; color:var(--punctuation); }
  @keyframes flash { from { background:rgba(107,138,253,.28); } to { background:transparent; } }
  .flash { animation:flash .8s ease-out; }
  .running .out:last-child::after { content:''; display:inline-block; width:6px; height:11px;
          margin-left:3px; background:var(--accent); vertical-align:-1px; animation:blink 1s steps(2) infinite; }
  @keyframes blink { to { visibility:hidden; } }
  .stopped { color:var(--flag); }

  /* Tokens ---------------------------------------------------------------- */
  .t { cursor:pointer; border-radius:3px; }
  .t.command{color:var(--command)} .t.flag{color:var(--flag)} .t.string{color:var(--string)}
  .t.variable{color:var(--variable)} .t.identifier{color:var(--identifier)}
  .t.type{color:var(--type)} .t.attribute{color:var(--attribute)} .t.punctuation{color:var(--punctuation)}
  .t.operator{color:var(--operator);font-weight:600} .t.member{color:var(--member)}
  .t.sel { background:rgba(107,138,253,.25); }

  /* Input ----------------------------------------------------------------- */
  #bar { flex:none; margin-top:8px; }
  #detail { font-size:11px; color:var(--dim); min-height:16px; margin-bottom:4px; }
  #prompt { font-size:11px; color:var(--dim); margin-bottom:4px; word-break:break-all;
            display:flex; align-items:center; gap:6px; min-height:22px; }
  #prompt .up {
    font:11px ui-monospace,monospace; padding:3px 9px; border-radius:6px; background:var(--panel);
    color:var(--type); border:1px solid var(--line); font-weight:600;
  }
  /* A view reads as the question it is, with the folder it was entered from behind it. */
  #prompt .viewing { color:var(--operator); font-weight:600; }
  #prompt .predicate { color:var(--member); }
  #prompt .inside { color:var(--punctuation); }
  #complete .key.view { color:var(--member); }
  .inputrow { display:flex; gap:6px; align-items:stretch; }
  /* A transparent input sits on a coloured mirror, so the text is tokenised while
     staying a real input the phone keyboard understands. */
  .field { position:relative; flex:1; min-width:0; }
  #mirror, #cmd {
    font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    white-space:pre; overflow:hidden;
  }
  #mirror { position:absolute; inset:0; background:var(--panel); pointer-events:none; color:var(--fg); }
  #cmd {
    position:relative; width:100%; background:transparent; color:transparent;
    caret-color:var(--fg); border-color:transparent;
  }
  #cmd:focus { outline:2px solid var(--accent); outline-offset:-2px; border-radius:9px; }
  button {
    font:13px ui-monospace,monospace; font-weight:600; padding:0 14px; border-radius:9px;
    border:1px solid transparent; background:var(--accent); color:#fff; cursor:pointer;
  }
  button.ghost { background:var(--panel); color:var(--dim); border-color:var(--line); padding:0 10px; }
  button.stop { background:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  /* Completions appear above the suggestions while typing; phones have no Tab key. */
  #complete:empty { display:none; }
  #complete .key { color:var(--fg); border-color:var(--accent); }
  #complete .key.directory { color:var(--type); }
  #complete .key.file { color:var(--identifier); }
  #complete .key.variable { color:var(--variable); }
  #complete .key.command { color:var(--command); }
  #complete .key.operator { color:var(--operator); }
  #complete .key.member { color:var(--member); }
  .keys { display:flex; gap:5px; overflow-x:auto; padding-top:6px; scrollbar-width:none; }
  .keys::-webkit-scrollbar { display:none; }
  .key {
    flex:none; font:12px ui-monospace,monospace; padding:5px 9px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer; white-space:nowrap;
  }
</style>
</head>
<body>
  <header>
    <h1>CommandLineReimagined</h1>
    <span class="status" id="status">starting…</span>
  </header>

  <div id="scroll"><div class="hint" id="banner">Loading the terminal…</div></div>

  <div id="bar">
    <div id="detail"></div>
    <div id="prompt"></div>
    <div class="inputrow">
      <div class="field">
        <div id="mirror"></div>
        <input id="cmd" disabled autocapitalize="off" autocorrect="off"
               autocomplete="off" spellcheck="false" enterkeyhint="go">
      </div>
      <button id="run" disabled>Run</button>
    </div>
    <div class="keys" id="complete"></div>
    <div class="keys" id="keys"></div>
  </div>

<!-- The log's storage. Loaded before the runtime, which calls into it during boot. -->
<script src="store.js"></script>
<script src="framework/blazor.webassembly.js" autostart="true"></script>
<script>
const $ = id => document.getElementById(id);
const scroll = $('scroll'), cmd = $('cmd'), mirror = $('mirror'), runButton = $('run');

let ready = false;
let history = [];        // previously executed lines
let historyIndex = -1;   // where Up/Down currently sits
let draft = '';          // what was typed before walking into history
let running = null;      // { id, entry } while a command executes
let nextId = 1;
let completions = [];    // what the last word could become

// ---- rendering ------------------------------------------------------------

const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/// Renders a token stream as spans. Each token carries the role the grammar gave it,
/// which is what makes them individually inspectable.
function tokenHtml(tokens) {
  return (tokens || []).map((t, i) =>
    t.kind === 'whitespace' || t.kind === 'newline'
      ? escape(t.text)
      : `<span class="t ${t.kind}" data-kind="${t.kind}" data-text="${escape(t.text)}">${escape(t.text)}</span>`
  ).join('');
}

function addEntry(html) {
  const div = document.createElement('div');
  div.className = 'entry';
  div.innerHTML = html;
  scroll.appendChild(div);
  scroll.scrollTop = scroll.scrollHeight;
  return div;
}

const linesHtml = lines => (lines || []).map(line => `<div class="out">${escape(line)}</div>`).join('');

/// A failure, with what sort of failure it was as a tag before the message.
///
/// The message is the sentence a person reads and has not changed. The kind is new,
/// and is what tells a missing file apart from a name that is already taken without
/// having to read the wording.
function faultHtml(r) {
  const kind = r.fault ? `<span class="kind">${escape(r.fault.kind.toLowerCase())}</span>` : '';
  return `<div class="err">${kind}${escape(r.error)}</div>`;
}

/// Results render three ways: a table as a table, text-like values as a block you can
/// read, and everything with an identity (paths, objects, variables) as a chip you can
/// tap to insert.
function itemsHtml(items) {
  let html = '';
  let chips = [];
  const flush = () => {
    if (chips.length) html += '<div class="items">' + chips.join('') + '</div>';
    chips = [];
  };

  for (const item of items || []) {
    if (item.kind === 'table') {
      flush();
      html += tableHtml(item);
    } else if (item.kind === 'text') {
      flush();
      html += `<div class="text">${escape(item.text)}</div>`;
    } else {
      chips.push(`<button class="item ${item.kind}" data-insert="${escape(item.text)}">${escape(item.text)}</button>`);
    }
  }

  flush();
  return html;
}

// ---- tables ---------------------------------------------------------------

/*
  Every rendered table keeps its data, so tapping a header can re-sort it without
  running the line again. This is a convenience over what is on screen and not a
  command: `ls | sort size desc` is the one that changes what the terminal answered,
  and this is the one that changes what you are looking at.
*/
const tables = new Map();
let nextTableId = 1;

function tableHtml(item) {
  const id = nextTableId++;
  tables.set(id, { columns: item.columns || [], rows: item.rows || [], sort: -1, desc: false });
  return `<div class="grid" data-table="${id}">${gridHtml(id)}</div>`;
}

/// Ordered the way the core orders: numbers numerically when the column agreed on a
/// number, everything else by the text on screen.
function sortedRows(table) {
  if (table.sort < 0) return table.rows;

  const index = table.sort;
  const numeric = (table.columns[index] || {}).type === 'number';

  const ordered = table.rows.slice().sort((a, b) => {
    const left = (a[index] || {}).text || '';
    const right = (b[index] || {}).text || '';
    return numeric ? Number(left) - Number(right) : (left < right ? -1 : left > right ? 1 : 0);
  });

  return table.desc ? ordered.reverse() : ordered;
}

/*
  What tapping a cell should write.

  A cell that names a place writes the line that takes you there, rather than the path
  on its own: a folder in the `name` column, and the `folder` column of a view's
  listing, which is the column that says which folder a row came from. Everything else
  inserts what it is, as it always has.
*/
function insertionFor(column, cell) {
  if (cell.kind === 'folder') return 'cd ' + (cell.path || cell.text);
  if (column && column.name === 'folder' && cell.text) return 'cd ' + cell.text;
  return cell.path || cell.text;
}

function gridHtml(id) {
  const table = tables.get(id);

  const head = table.columns.map((column, index) =>
    `<th data-column="${index}" class="${table.sort === index ? (table.desc ? 'desc' : 'asc') : ''}">` +
    `${escape(column.name)}</th>`).join('');

  const body = sortedRows(table).map(row =>
    '<tr>' + row.map((cell, index) =>
      `<td class="${cell.kind}" data-insert="${escape(insertionFor(table.columns[index], cell))}">` +
      `${escape(cell.text)}</td>`
    ).join('') + '</tr>').join('');

  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

/// Forgets the tables an entry was showing, so re-rendering one does not leave its
/// old data behind in the map for the rest of the session.
function forgetTables(element) {
  for (const grid of element.querySelectorAll('.grid')) tables.delete(Number(grid.dataset.table));
}

/// Starts an entry the moment a command is submitted, so live output has somewhere to
/// go before the result arrives.
function startEntry(id, text) {
  let echoed = escape(text);
  try {
    const parsed = JSON.parse(DotNet.invokeMethod('WebClient', 'Parse', text));
    if (!parsed.error) echoed = tokenHtml(parsed.tokens);
  } catch {}

  const entry = addEntry(
    `<div class="echo"><span class="sigil">$ </span>${echoed}</div>` +
    `<div class="live"></div><div class="tail"></div><div class="watch"></div>`);
  entry.classList.add('running');
  return entry;
}

function finishEntry(entry, r) {
  entry.classList.remove('running');
  entry.querySelector('.live').innerHTML = linesHtml(r.output);

  let tail = '';
  if (r.error === 'Stopped.') tail = `<div class="stopped">${escape(r.error)}</div>`;
  else if (r.error) tail = faultHtml(r);
  else tail = itemsHtml(r.result);

  entry.querySelector('.tail').innerHTML = tail;
  scroll.scrollTop = scroll.scrollHeight;
}

// ---- live listings --------------------------------------------------------

/*
  The newest listing keeps itself up to date.

  A listing is a question about the store, and the store changes under it: `mkdir x`
  in the next entry makes the answer above it wrong. Because the log says when it
  changed, the page can ask the question again — through `Refresh`, which re-reads and
  commits nothing — and replace the table in place. Only the newest listing does this;
  the ones above it froze when they scrolled out of the conversation, which is what a
  scrollback is for.
*/
let live = null;       // { entry, source, on } for the newest listing
let refreshWanted = false;

/// Which lines are worth keeping live: the two that ask what is there.
const listings = ['ls', 'find'];

function isListing(text) {
  return listings.includes(text.trim().split(/[\s|]/)[0]);
}

function markLive(entry, source) {
  if (live && live.entry !== entry) {
    const bar = live.entry.querySelector('.watch');
    if (bar) bar.innerHTML = '<span class="frozen">frozen</span>';
  }

  live = { entry, source, on: true };
  drawWatch();
}

function drawWatch() {
  if (!live) return;
  const bar = live.entry.querySelector('.watch');
  if (!bar) return;

  bar.innerHTML = `<button class="badge ${live.on ? 'on' : ''}">${live.on ? 'live' : 'paused'}</button>`;

  bar.querySelector('button').onclick = () => {
    live.on = !live.on;
    drawWatch();
    if (live.on) refreshLive();
  };
}

/// Asks the same question again and redraws the answer. A refusal or a failure leaves
/// what is on screen alone: a listing that has gone wrong is better than a blank one.
async function refreshLive() {
  refreshWanted = false;
  if (!live || !live.on || running || !ready) return;

  const target = live;

  try {
    const response = JSON.parse(await DotNet.invokeMethodAsync('WebClient', 'Refresh', target.source));
    if (response.error || live !== target) return;

    const tail = target.entry.querySelector('.tail');
    forgetTables(tail);
    tail.innerHTML = itemsHtml(response.result);

    // A table that changed while you were reading it has to say so, or the numbers
    // just quietly disagree with what you remember.
    tail.classList.remove('flash');
    void tail.offsetWidth;
    tail.classList.add('flash');
  } catch {
    // The runtime may be busy or gone. The next change asks again.
  }
}

// Called from .NET: while a command runs, with the complete current output lines, and
// after every commit, with the sequence number the store reached.
window.terminal = {
  output(id, lines) {
    if (!running || running.id !== id) return;
    running.entry.querySelector('.live').innerHTML = linesHtml(lines);
    scroll.scrollTop = scroll.scrollHeight;
  },

  // Raised from inside the commit, which is inside the call the page is still
  // awaiting, so the refresh is deferred rather than run here. A line finishing
  // refreshes too, which is what picks this up when it arrives mid-execution.
  storeChanged() {
    refreshWanted = true;
    if (!running) setTimeout(refreshLive, 0);
  }
};

// ---- the live input mirror ------------------------------------------------

function refreshMirror() {
  const text = cmd.value;

  if (!ready || text.length === 0) {
    mirror.innerHTML = text.length ? escape(text) : '<span class="hint">type a command…</span>';
    return;
  }

  try {
    const parsed = JSON.parse(DotNet.invokeMethod('WebClient', 'Parse', text));
    // While a command is half-typed it is usually not valid yet, so an error is
    // expected and shown by leaving the text plain rather than by complaining.
    mirror.innerHTML = parsed.error ? escape(text) : tokenHtml(parsed.tokens);
  } catch {
    mirror.innerHTML = escape(text);
  }

  mirror.scrollLeft = cmd.scrollLeft;
}

// ---- completion -----------------------------------------------------------

function refreshCompletions() {
  const row = $('complete');
  completions = [];
  row.innerHTML = '';
  if (!ready || !cmd.value.length) return;

  try { completions = JSON.parse(DotNet.invokeMethod('WebClient', 'Complete', cmd.value)); } catch { return; }

  // Nothing to offer when the word is already exactly the only completion.
  if (completions.length === 1 && cmd.value.slice(completions[0].start) === completions[0].text) {
    completions = []; return;
  }

  for (const c of completions.slice(0, 12)) {
    const b = document.createElement('button');
    b.className = `key ${c.kind}`; b.textContent = c.text;
    b.onclick = () => applyCompletion(c);
    row.appendChild(b);
  }
}

function applyCompletion(c) {
  const trailing = c.kind === 'directory' ? '' : ' ';
  cmd.value = cmd.value.slice(0, c.start) + c.text + trailing;
  refreshMirror(); refreshCompletions(); cmd.focus();
}

// ---- executing ------------------------------------------------------------

async function run() {
  if (running) { stop(); return; }

  const text = cmd.value.trim();
  if (!ready || !text) return;

  // Handled by the page rather than the evaluator, because it is about the screen
  // rather than about the filesystem. `undo` used to be here too, and `help` until
  // Phase 3; both are real commands now, so they go through the evaluator like
  // everything else and can be piped.
  if (text === 'clear') { scroll.innerHTML = ''; tables.clear(); live = null; afterRun(text); return; }

  const id = nextId++;
  running = { id, entry: startEntry(id, text) };
  runButton.textContent = 'Stop'; runButton.classList.add('stop');
  afterRun(text);

  const entry = running.entry;

  try {
    const response = await DotNet.invokeMethodAsync('WebClient', 'Execute', text, id);
    const result = JSON.parse(response);
    finishEntry(entry, result);

    // The newest listing is the one kept live, and only when it answered a table:
    // a failed `ls` has nothing to keep up to date.
    if (!result.error && isListing(text) && (result.result || []).some(item => item.kind === 'table')) {
      markLive(entry, text);
    }
  } catch (e) {
    entry.classList.remove('running');
    entry.querySelector('.tail').innerHTML = `<div class="err">${escape(String(e))}</div>`;
  } finally {
    running = null;
    runButton.textContent = 'Run'; runButton.classList.remove('stop');
    await refreshPrompt();

    // A commit raised `storeChanged` while this line was still running, so the
    // refresh it asked for happens now that nothing is in flight.
    if (refreshWanted) await refreshLive();

    cmd.focus();
  }
}

function stop() {
  if (!running) return;
  try { DotNet.invokeMethod('WebClient', 'Cancel'); } catch {}
}

function afterRun(text) {
  if (history[history.length - 1] !== text) history.push(text);
  historyIndex = -1; draft = '';
  cmd.value = '';
  refreshMirror(); refreshCompletions();
}

/*
  Where you are, and the one way out of it.

  A listing is a table of records from Phase 3, and a table has nowhere to put the `up`
  entry that used to head one: every row is a record, and `up` is not. It lives here
  instead, beside the folder it would take you out of, and it runs the `up` command.

  From Phase 4 there are two ways of being somewhere. A folder reads as its path; a
  view reads as the question it is, with the folder it was entered from behind it,
  because that is still where a new file would land. `up` leaves the view first and the
  folder second, in the order they were entered.
*/
async function refreshPrompt() {
  if (!ready) return;
  const location = JSON.parse(DotNet.invokeMethod('WebClient', 'Location'));

  const where = location.view
    ? `<span class="viewing">view:</span> <span class="predicate">${escape(location.view)}</span>` +
      `<span class="inside"> in ${escape(location.folder)}</span>`
    : escape(location.folder);

  const canGoUp = !!location.view || location.folder !== '/';

  $('prompt').innerHTML = canGoUp
    ? `<button class="up" id="up">up</button> ${where}`
    : where;

  if (canGoUp) $('up').onclick = () => { cmd.value = 'up'; run(); };
}

// ---- input handling -------------------------------------------------------

cmd.addEventListener('input', () => { refreshMirror(); refreshCompletions(); });
cmd.addEventListener('scroll', () => { mirror.scrollLeft = cmd.scrollLeft; });

cmd.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); run(); return; }
  if (e.key === 'Escape' && running) { e.preventDefault(); stop(); return; }

  // Walk back through what has already been run.
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!history.length) return;
    if (historyIndex === -1) { draft = cmd.value; historyIndex = history.length; }
    historyIndex = Math.max(0, historyIndex - 1);
    cmd.value = history[historyIndex];
    refreshMirror(); refreshCompletions();
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex === -1) return;
    historyIndex++;
    if (historyIndex >= history.length) { historyIndex = -1; cmd.value = draft; }
    else cmd.value = history[historyIndex];
    refreshMirror(); refreshCompletions();
    return;
  }

  // Tab takes the only completion, or the common prefix of several.
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!completions.length) return;
    if (completions.length === 1) { applyCompletion(completions[0]); return; }
    let prefix = completions[0].text;
    for (const c of completions) while (!c.text.toLowerCase().startsWith(prefix.toLowerCase())) prefix = prefix.slice(0, -1);
    if (prefix.length > cmd.value.length - completions[0].start) {
      cmd.value = cmd.value.slice(0, completions[0].start) + prefix;
      refreshMirror(); refreshCompletions();
    }
  }
});

// Tapping a token says what the grammar decided it was; tapping a result inserts it.
document.addEventListener('click', e => {
  const token = e.target.closest('.t');
  if (token) {
    document.querySelectorAll('.t.sel').forEach(el => el.classList.remove('sel'));
    token.classList.add('sel');
    $('detail').innerHTML =
      `<b class="t ${token.dataset.kind}">${token.dataset.kind}</b> — ${escape(token.dataset.text)}`;
    return;
  }

  // A header re-sorts what is on screen; it does not run anything.
  const header = e.target.closest('.grid th');
  if (header) {
    const grid = header.closest('.grid');
    const id = Number(grid.dataset.table);
    const table = tables.get(id);
    const column = Number(header.dataset.column);

    if (table.sort === column) table.desc = !table.desc;
    else { table.sort = column; table.desc = false; }

    grid.innerHTML = gridHtml(id);
    return;
  }

  const cell = e.target.closest('.grid td');
  if (cell) {
    insert(cell.dataset.insert);
    return;
  }

  const item = e.target.closest('.item');
  if (item) {
    insert(item.dataset.insert);
  }
});

/// Appends to the line being typed, with a space before it if something is there.
function insert(text) {
  if (!text) return;
  cmd.value = (cmd.value ? cmd.value.replace(/\s*$/, ' ') : '') + text;
  refreshMirror(); refreshCompletions();
  cmd.focus();
}

runButton.onclick = run;

/// What the banner says depends on whether this is a first visit, a restored one, or a
/// session that will not be kept. Saying "nothing is sent anywhere" matters more once
/// something is being stored, so that is where it is said.
function bannerFor(store) {
  const common =
    'The parser, the commands and the filesystem are all .NET compiled to WebAssembly. ' +
    'Type <b>help</b> for the commands, or tap a suggestion below. ' +
    'Listings are tables you can question: <b>ls | where $row.kind eq folder | count</b>. ' +
    'A question is also somewhere you can be: <b>cd $row.kind eq folder</b> enters it, ' +
    '<b>ls</b> lists it across folders, <b>up</b> leaves it, <b>find</b> asks it once ' +
    'and <b>save-view</b> keeps it as a file. The newest listing stays live as the ' +
    'filesystem changes; tap <b>live</b> under it to stop. ' +
    'Also pipes, the function form (echo(a, b)), tags (&lt;thing a=1/&gt;), ' +
    'components ({renderer/}) and variables (set v 5, then $v). ' +
    'Tap a column header to re-sort what is on screen, or a cell to insert it. ' +
    '<b>clear</b> empties the screen; <b>undo</b>, <b>redo</b> and <b>history</b> are commands.';

  if (!store.persistent) {
    return 'A terminal running in this tab. ' + common +
           ' This browser is not keeping the log, so everything here disappears when the tab does.';
  }

  if (store.replayed > 0) {
    return `Restored ${store.replayed} line(s) from last time. ` + common +
           ' Your files live in this browser, and are not sent anywhere.';
  }

  return 'A terminal running in this tab. ' + common +
         ' Your files are kept in this browser between visits, and are not sent anywhere.';
}

// ---- boot -----------------------------------------------------------------

(function waitForRuntime(attempt) {
  if (window.DotNet && typeof DotNet.invokeMethod === 'function') {
    try {
      DotNet.invokeMethod('WebClient', 'Parse', '');
    } catch {
      if (attempt < 400) return setTimeout(() => waitForRuntime(attempt + 1), 100);
    }

    // Replaying the log is asynchronous, and nothing may run until it has finished:
    // an empty filesystem looks exactly like a lost one. Today it returns at once;
    // in Phase 2 it reads IndexedDB, and the wait is already in the right place.
    $('status').innerHTML = '<span style="color:var(--dim)">restoring…</span>';

    DotNet.invokeMethodAsync('WebClient', 'Initialize')
      .then(status => finishBoot(JSON.parse(status)))
      .catch(e => {
        // The message matters: a session that cannot restore is showing the user an
        // empty filesystem that may not be empty, and "failed" alone says nothing about
        // whether their files are gone or the code is broken.
        $('status').innerHTML = '<span style="color:var(--bad)">failed to restore</span>';
        addEntry(`<div class="err">Could not restore the session: ${escape(String(e && e.message || e))}</div>`);
      });
    return;
  }

  if (attempt < 400) setTimeout(() => waitForRuntime(attempt + 1), 100);
  else $('status').innerHTML = '<span style="color:var(--bad)">failed to load</span>';
})(0);

function finishBoot(store) {
    ready = true;
    cmd.disabled = false; runButton.disabled = false;

    // `not persisted` is said up front, before anything is typed. Finding out after a
    // morning's work that none of it was being kept would be the worst moment to learn
    // it, and a private window is the common case rather than a broken one.
    $('status').innerHTML = store.persistent
      ? '<span style="color:var(--ok)">wasm</span>'
      : '<span style="color:var(--ok)">wasm</span> <span class="warn" title="' +
        escape(store.reason || 'This browser is not keeping the log.') +
        '">not persisted</span>';

    $('banner').innerHTML = bannerFor(store);

    if (store.unreadable > 0) {
      addEntry(`<div class="err">${store.unreadable} stored line(s) could not be read and were skipped. ` +
               `<b>reset</b> starts over.</div>`);
    }

    refreshPrompt();
    refreshMirror();
    cmd.focus();
}

refreshMirror();

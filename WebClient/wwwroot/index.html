<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CommandLineReimagined</title>
<base href="/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%96%B8%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg:#12131a; --panel:#1b1d27; --line:#2a2d3a; --fg:#e6e6ef; --dim:#8a8ba3;
    --ok:#4ade80; --bad:#f87171; --accent:#6b8afd;
    --command:#7aa2f7; --flag:#e0af68; --string:#9ece6a; --variable:#bb9af7;
    --identifier:#c0caf5; --type:#2ac3de; --attribute:#ff9e64; --punctuation:#565f89;
    --operator:#f7768e; --member:#7dcfff; --keyword:#ff9eb8;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f7f7fb; --panel:#fff; --line:#e2e3ec; --fg:#1a1b23; --dim:#63657a;
      --command:#2f5fd0; --flag:#a35a00; --string:#2d7a2d; --variable:#7132b8;
      --identifier:#1a1b23; --type:#0b6e86; --attribute:#a34a00; --punctuation:#8b8fa3;
      --operator:#b1004a; --member:#0b5d86; --keyword:#8a1f6b;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    display:flex; flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%; overflow:hidden;
  }

  header { flex:none; display:flex; align-items:baseline; gap:8px; margin-bottom:8px; }
  h1 { font-size:14px; margin:0; flex:1; }
  .status { font-size:11px; color:var(--dim); }

  /* Scrollback ------------------------------------------------------------ */
  #scroll {
    flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:10px; min-height:0;
  }
  .entry { margin-bottom:10px; }
  .entry:last-child { margin-bottom:0; }
  /* A line that was undone. Kept, out of sight, so that redo can put it back where it was. */
  .entry.undone { display:none; }
  .echo { white-space:pre-wrap; word-break:break-word; }
  .echo .sigil { color:var(--dim); }
  .out { white-space:pre-wrap; word-break:break-word; color:var(--fg); opacity:.85; }
  .err { color:var(--bad); white-space:pre-wrap; word-break:break-word; }
  .warn {
    color:var(--flag); border:1px solid var(--flag); border-radius:4px;
    padding:0 4px; font-size:10px; cursor:help;
  }
  .kind {
    display:inline-block; font-size:10px; text-transform:lowercase; letter-spacing:.03em;
    border:1px solid var(--bad); border-radius:4px; padding:0 4px; margin-right:6px;
    opacity:.8; vertical-align:1px;
  }
  .hint { color:var(--dim); }

  /* Result chips ---------------------------------------------------------- */
  .items { display:flex; flex-wrap:wrap; gap:5px; margin-top:4px; }
  /*
    44 pixels tall. A result chip is a tap target on a phone, and 4px of padding made
    one about 20 pixels, which is half of what a finger can reliably hit.
  */
  .item {
    font:12px ui-monospace,monospace; padding:12px 12px; border-radius:6px;
    border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer;
    min-height:44px;
  }
  .item.folder { color:var(--type); }
  .item.file { color:var(--identifier); }
  .item.object, .item.component, .item.variable { color:var(--variable); }
  .item.number, .item.boolean { color:var(--flag); }
  /*
    A fault that try or else caught. It is a value, not an error — the line went on —
    so it is drawn in the warning colour rather than the red of a failed line, with its
    kind as the same small tag a failure carries.
  */
  .caught { white-space:pre-wrap; word-break:break-word; margin-top:4px; padding:6px 8px;
            border-left:2px solid var(--flag); color:var(--flag); }
  .caught .kind { border-color:var(--flag); }
  /* Text results (cat, echo) read as a block, not as a chip to insert. */
  .text { white-space:pre-wrap; word-break:break-word; margin-top:4px; padding:6px 8px;
          border-left:2px solid var(--line); color:var(--fg); }

  /* Tables ---------------------------------------------------------------- */
  /*
    A wide table scrolls sideways inside its own entry rather than widening the page:
    at 390 pixels a listing with six columns does not fit, and a page that scrolls
    horizontally as a whole is unusable on a phone.
  */
  .grid { margin-top:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .grid table { border-collapse:collapse; font:12px ui-monospace,monospace; }
  .grid th, .grid td { text-align:left; padding:8px 10px; white-space:nowrap;
                       border-bottom:1px solid var(--line); }
  .grid th {
    color:var(--dim); font-weight:600; cursor:pointer; position:sticky; top:0;
    background:var(--panel); user-select:none; min-height:44px;
  }
  .grid th::after { content:''; color:var(--accent); }
  .grid th.asc::after { content:' ▲'; }
  .grid th.desc::after { content:' ▼'; }
  .grid tr:last-child td { border-bottom:none; }
  /* A cell is a tap target like a chip, so a listing stays something you drive by touch. */
  .grid td { cursor:pointer; min-height:44px; height:44px; }
  .grid td.folder { color:var(--type); }
  .grid td.file { color:var(--identifier); }
  .grid td.number, .grid td.boolean { color:var(--flag); }
  .grid td.object, .grid td.table { color:var(--variable); }
  .grid td.none { color:var(--punctuation); }
  .grid td.fault { color:var(--flag); }
  .grid td.none::before { content:'—'; }
  /*
    A live listing. The badge says the table is being kept up to date and is the way to
    stop it; the flash is how a table that changed under you says that it did, which a
    silent redraw could not.
  */
  .watch:empty { display:none; }
  .watch { margin-top:4px; }
  .watch .badge {
    font:11px ui-monospace,monospace; padding:6px 10px; border-radius:6px; min-height:28px;
    border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer;
  }
  .watch .badge.on { color:var(--ok); border-color:var(--ok); }
  .watch .frozen { font-size:11px; color:var(--punctuation); }
  @keyframes flash { from { background:rgba(107,138,253,.28); } to { background:transparent; } }
  .flash { animation:flash .8s ease-out; }
  .running .out:last-child::after { content:''; display:inline-block; width:6px; height:11px;
          margin-left:3px; background:var(--accent); vertical-align:-1px; animation:blink 1s steps(2) infinite; }
  @keyframes blink { to { visibility:hidden; } }
  .stopped { color:var(--flag); }

  /* Tokens ---------------------------------------------------------------- */
  .t { cursor:pointer; border-radius:3px; }
  .t.command{color:var(--command)} .t.flag{color:var(--flag)} .t.string{color:var(--string)}
  .t.variable{color:var(--variable)} .t.identifier{color:var(--identifier)}
  .t.type{color:var(--type)} .t.attribute{color:var(--attribute)} .t.punctuation{color:var(--punctuation)}
  .t.operator{color:var(--operator);font-weight:600} .t.member{color:var(--member)}
  .t.keyword{color:var(--keyword);font-weight:600;font-style:italic}
  .t.sel { background:rgba(107,138,253,.25); }

  /* Input ----------------------------------------------------------------- */
  #bar { flex:none; margin-top:8px; }
  /*
    The detail line has one job at a time: the signature while in an argument, else the
    selected chip's detail, else a parse error that is behind the word being typed. A
    tapped token takes it over until the next keystroke.
  */
  #detail { font-size:11px; color:var(--dim); min-height:16px; margin-bottom:4px; word-break:break-word; }
  #detail .t { cursor:default; }
  #detail .param { color:var(--dim); }
  #detail .param.on { color:var(--fg); font-weight:700; }
  #detail .problem { color:var(--bad); }
  /* An error already behind the word being typed. A half-written word is never marked. */
  #mirror .bad { text-decoration:underline wavy var(--bad); text-decoration-skip-ink:none; text-underline-offset:3px; }
  #prompt { font-size:11px; color:var(--dim); margin-bottom:4px; word-break:break-all;
            display:flex; align-items:center; gap:6px; min-height:22px; }
  #prompt .up, #prompt .step {
    font:11px ui-monospace,monospace; padding:3px 9px; border-radius:6px; background:var(--panel);
    color:var(--type); border:1px solid var(--line); font-weight:600;
  }
  /* Undo and redo are the arrows alone, so they are drawn a size up to read as glyphs. */
  #prompt .step { font:600 17px/16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:2px 10px; color:var(--fg); }
  /* A view reads as the question it is, with the folder it was entered from behind it. */
  #prompt .viewing { color:var(--operator); font-weight:600; }
  #prompt .predicate { color:var(--member); }
  #prompt .inside { color:var(--punctuation); }
  #complete .key.view { color:var(--member); }
  .inputrow { display:flex; gap:6px; align-items:stretch; }
  /* A transparent input sits on a coloured mirror, so the text is tokenised while
     staying a real input the phone keyboard understands. */
  .field { position:relative; flex:1; min-width:0; }
  #mirror, #cmd {
    font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:11px 12px; border:1px solid var(--line); border-radius:9px;
    white-space:pre; overflow:hidden;
  }
  #mirror { position:absolute; inset:0; background:var(--panel); pointer-events:none; color:var(--fg); }
  #cmd {
    position:relative; width:100%; background:transparent; color:transparent;
    caret-color:var(--fg); border-color:transparent;
  }
  #cmd:focus { outline:2px solid var(--accent); outline-offset:-2px; border-radius:9px; }
  button {
    font:13px ui-monospace,monospace; font-weight:600; padding:0 14px; border-radius:9px;
    border:1px solid transparent; background:var(--accent); color:#fff; cursor:pointer;
  }
  button.ghost { background:var(--panel); color:var(--dim); border-color:var(--line); padding:0 10px; }
  button.stop { background:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  /* Completions appear above the suggestions while typing; phones have no Tab key. */
  #complete:empty { display:none; }
  #complete .key { color:var(--fg); border-color:var(--accent); }
  #complete .key.folder { color:var(--type); }
  #complete .key.file { color:var(--identifier); }
  #complete .key.variable { color:var(--variable); }
  #complete .key.command { color:var(--command); }
  #complete .key.operator { color:var(--operator); }
  #complete .key.member { color:var(--member); }
  #complete .key.keyword { color:var(--keyword); font-style:italic; }
  #complete .key.flag { color:var(--flag); }
  /* The chip Tab puts in place next, and whose detail the detail line shows. */
  #complete .key.sel { background:rgba(107,138,253,.22); box-shadow:inset 0 0 0 1px var(--accent); }
  #complete .key.more { color:var(--dim); border-style:dashed; }
  .keys { display:flex; gap:5px; overflow-x:auto; padding-top:6px; scrollbar-width:none; }
  .keys::-webkit-scrollbar { display:none; }
  /* 44 pixels tall, like a result chip: every chip is a tap target on a phone. */
  .key {
    flex:none; font:12px ui-monospace,monospace; padding:0 12px; min-height:44px; border-radius:6px;
    border:1px solid var(--line); background:var(--panel); color:var(--dim); cursor:pointer; white-space:nowrap;
  }
</style>
</head>
<body>
  <header>
    <h1>CommandLineReimagined</h1>
    <span class="status" id="status">starting…</span>
  </header>

  <div id="scroll"><div class="hint" id="banner">Loading the terminal…</div></div>

  <div id="bar">
    <div id="detail"></div>
    <div id="prompt"></div>
    <div class="inputrow">
      <div class="field">
        <div id="mirror"></div>
        <input id="cmd" disabled autocapitalize="off" autocorrect="off"
               autocomplete="off" spellcheck="false" enterkeyhint="go">
      </div>
      <button id="run" disabled>Run</button>
    </div>
    <div class="keys" id="complete"></div>
    <div class="keys" id="keys"></div>
  </div>

<!-- The log's storage. Loaded before the runtime, which calls into it during boot. -->
<script src="store.js"></script>
<script src="framework/blazor.webassembly.js" autostart="true"></script>
<script>
const $ = id => document.getElementById(id);
const scroll = $('scroll'), cmd = $('cmd'), mirror = $('mirror'), runButton = $('run');

let ready = false;
let history = [];        // previously executed lines
let historyIndex = -1;   // where Up/Down currently sits
let draft = '';          // what was typed before walking into history
let running = null;      // { id, entry } while a command executes
let nextId = 1;
let completions = [];    // what the last word could become

// ---- rendering ------------------------------------------------------------

// Quotes too, because the same text goes into attributes: a name holding a double quote,
// or a path the page has quoted to insert, would otherwise end `data-insert` early.
const escape = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/// Renders a token stream as spans. Each token carries the role the grammar gave it,
/// which is what makes them individually inspectable, and where it ends in the line the
/// tokens spell, which is the offset a tap asks the core about.
function tokenHtml(tokens) {
  let offset = 0;
  return (tokens || []).map(t => {
    offset += t.text.length;
    return t.kind === 'whitespace' || t.kind === 'newline'
      ? escape(t.text)
      : `<span class="t ${t.kind}" data-kind="${t.kind}" data-text="${escape(t.text)}" data-end="${offset}">${escape(t.text)}</span>`;
  }).join('');
}

/// The line a token stream spells. The tokens come from the tree, so this is the line as
/// the parser writes it back, and it is what the offsets in `tokenHtml` count through.
const tokenText = tokens => (tokens || []).map(t => t.text).join('');

function addEntry(html) {
  const div = document.createElement('div');
  div.className = 'entry';
  div.innerHTML = html;
  scroll.appendChild(div);
  scroll.scrollTop = scroll.scrollHeight;
  return div;
}

const linesHtml = lines => (lines || []).map(line => `<div class="out">${escape(line)}</div>`).join('');

/// A failure, with what sort of failure it was as a tag before the message.
///
/// The message is the sentence a person reads and has not changed. The kind is new,
/// and is what tells a missing file apart from a name that is already taken without
/// having to read the wording.
function faultHtml(r) {
  const kind = r.fault ? `<span class="kind">${escape(r.fault.kind.toLowerCase())}</span>` : '';
  return `<div class="err">${kind}${escape(r.error)}</div>`;
}

/// A fault that `try` or `else` made into a value (Phase 5). It reads like the failure
/// it was, because it is that failure, and looks unlike one, because the line did not
/// stop: the kind is the word `$problem.kind` would read, so what is on screen is what a
/// script would compare against.
function caughtHtml(item) {
  const kind = item.faultKind ? `<span class="kind">${escape(item.faultKind)}</span>` : '';
  return `<div class="caught" data-fault-kind="${escape(item.faultKind || '')}">${kind}${escape(item.text)}</div>`;
}

/// Results render three ways: a table as a table, text-like values as a block you can
/// read, and everything with an identity (paths, objects, variables) as a chip you can
/// tap to insert.
function itemsHtml(items) {
  let html = '';
  let chips = [];
  const flush = () => {
    if (chips.length) html += '<div class="items">' + chips.join('') + '</div>';
    chips = [];
  };

  for (const item of items || []) {
    if (item.kind === 'table') {
      flush();
      html += tableHtml(item);
    } else if (item.kind === 'text') {
      flush();
      html += `<div class="text">${escape(item.text)}</div>`;
    } else if (item.kind === 'fault') {
      flush();
      html += caughtHtml(item);
    } else {
      const insertion = item.kind === 'file' || item.kind === 'folder' ? asWord(item.path || item.text) : item.text;
      chips.push(`<button class="item ${item.kind}" data-insert="${escape(insertion)}">${escape(item.text)}</button>`);
    }
  }

  flush();
  return html;
}

// ---- tables ---------------------------------------------------------------

/*
  Every rendered table keeps its data, so tapping a header can re-sort it without
  running the line again. This is a convenience over what is on screen and not a
  command: `ls | sort size desc` is the one that changes what the terminal answered,
  and this is the one that changes what you are looking at.
*/
const tables = new Map();
let nextTableId = 1;

function tableHtml(item) {
  const id = nextTableId++;
  tables.set(id, { columns: item.columns || [], rows: item.rows || [], sort: -1, desc: false });
  return `<div class="grid" data-table="${id}">${gridHtml(id)}</div>`;
}

/// Ordered the way the core orders: numbers numerically when the column agreed on a
/// number, everything else by the text on screen.
function sortedRows(table) {
  if (table.sort < 0) return table.rows;

  const index = table.sort;
  const numeric = (table.columns[index] || {}).type === 'number';

  const ordered = table.rows.slice().sort((a, b) => {
    const left = (a[index] || {}).text || '';
    const right = (b[index] || {}).text || '';
    return numeric ? Number(left) - Number(right) : (left < right ? -1 : left > right ? 1 : 0);
  });

  return table.desc ? ordered.reverse() : ordered;
}

/*
  What tapping a cell should write.

  A cell that names a place writes the line that takes you there, rather than the path
  on its own: a folder in the `name` column, and the `folder` column of a view's
  listing, which is the column that says which folder a row came from. Everything else
  inserts what it is, as it always has.
*/
function insertionFor(column, cell) {
  if (cell.kind === 'folder') return 'cd ' + asWord(cell.path || cell.text);
  if (column && column.name === 'folder' && cell.text) return 'cd ' + asWord(cell.text);
  if (cell.kind === 'file') return asWord(cell.path || cell.text);
  return cell.path || cell.text;
}

/*
  A path as the line would need it written. Most names are bare words and go in as
  they are; a name with a space, a character the grammar gives a meaning to, or one
  that is a reserved word, is quoted, or tapping `my notes.txt` would insert two
  arguments. The grammar's strings take as many quotes as they open with, so a name
  holding quotes is wrapped in one more than its longest run.
*/
const RESERVED = new Set(['and', 'or', 'not', 'eq', 'ne', 'gt', 'ge', 'lt', 'le', 'like', 'has', 'else', 'try']);

function asWord(text) {
  if (text && /^[^\s"'|<>(){}\[\],:=$?]+$/.test(text) && !text.startsWith('-') && !RESERVED.has(text)) return text;
  const longest = Math.max(0, ...((text || '').match(/"+/g) || []).map(run => run.length));
  const quotes = '"'.repeat(longest + 1);
  return quotes + (text || '') + quotes;
}

function gridHtml(id) {
  const table = tables.get(id);

  const head = table.columns.map((column, index) =>
    `<th data-column="${index}" class="${table.sort === index ? (table.desc ? 'desc' : 'asc') : ''}">` +
    `${escape(column.name)}</th>`).join('');

  const body = sortedRows(table).map(row =>
    '<tr>' + row.map((cell, index) =>
      `<td class="${cell.kind}" data-insert="${escape(insertionFor(table.columns[index], cell))}">` +
      `${escape(cell.text)}</td>`
    ).join('') + '</tr>').join('');

  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

/// Forgets the tables an entry was showing, so re-rendering one does not leave its
/// old data behind in the map for the rest of the session.
function forgetTables(element) {
  for (const grid of element.querySelectorAll('.grid')) tables.delete(Number(grid.dataset.table));
}

/// Starts an entry the moment a command is submitted, so live output has somewhere to
/// go before the result arrives.
function startEntry(id, text) {
  let echoed = escape(text);
  let source = '';
  try {
    const parsed = JSON.parse(DotNet.invokeMethod('WebClient', 'Parse', text));
    if (!parsed.error) { echoed = tokenHtml(parsed.tokens); source = tokenText(parsed.tokens); }
  } catch {}

  const entry = addEntry(
    `<div class="echo" data-source="${escape(source)}"><span class="sigil">$ </span>${echoed}</div>` +
    `<div class="live"></div><div class="tail"></div><div class="watch"></div>`);
  entry.classList.add('running');
  entry.dataset.id = id;
  return entry;
}

function finishEntry(entry, r) {
  entry.classList.remove('running');
  entry.querySelector('.live').innerHTML = linesHtml(r.output);

  let tail = '';
  if (r.error === 'Stopped.') tail = `<div class="stopped">${escape(r.error)}</div>`;
  else if (r.error) tail = faultHtml(r);
  else tail = itemsHtml(r.result);

  entry.querySelector('.tail').innerHTML = tail;
  scroll.scrollTop = scroll.scrollHeight;
}

// ---- undo and redo --------------------------------------------------------

/*
  Undo takes a line back; it does not add one.

  To the person at the prompt, `undo` means the last thing they did did not happen. So
  the entry for that line goes away, and the undo leaves no entry of its own; `redo`
  brings the entry back where it was. The log underneath still records the undo and
  the redo as lines of their own, and `history` still shows them: that is the event
  record, and it is there when you ask for it rather than on the screen as you work.

  Every response says, by sequence number, which lines it committed and which it undid
  or redid, and the number is always the line's own rather than the undo's. So each
  entry remembers the numbers it committed, and an entry is hidden once every one of
  them is undone. Usually that is one number; a `run` commits one per script line.

  When the line it reverses is not on screen — after `clear`, after a reload, or when
  there was nothing to undo — the undo keeps its entry, because otherwise nothing at
  all would show that it did anything.
*/
const committedBy = new Map();   // sequence number → the entry that committed it

function remember(entry, seq) {
  committedBy.set(seq, entry);
  (entry.lines ??= new Map()).set(seq, true);
}

/// Marks one line as standing or not, and hides its entry when nothing of it stands.
/// Answers whether the line was on screen to act on.
function standing(seq, stands) {
  const entry = committedBy.get(seq);
  if (!entry || !entry.isConnected) return false;

  entry.lines.set(seq, stands);
  const shown = [...entry.lines.values()].some(Boolean);
  const wasHidden = entry.classList.contains('undone');
  entry.classList.toggle('undone', !shown);

  // Coming back where it was can be far above the prompt, so it is brought into view
  // and flashes, the way a live table says that it changed.
  if (shown && wasHidden) {
    entry.scrollIntoView({ block: 'nearest' });
    entry.classList.remove('flash');
    void entry.offsetWidth;
    entry.classList.add('flash');
  }

  return true;
}

/// After `reset` the numbers start again, so what was remembered names nothing, and
/// an entry waiting for a redo will never get one.
function forgetLines() {
  for (const entry of new Set(committedBy.values())) {
    if (entry.classList.contains('undone')) { forgetTables(entry); entry.remove(); }
  }
  if (live && !live.entry.isConnected) live = null;
  committedBy.clear();
}

/// Applies what a line did to the log to the entries on screen. Answers whether the
/// line did nothing but take back or put back lines that are on screen, in which case
/// its own entry has nothing left to say.
function applyChanges(entry, r) {
  const changes = r.changes || {};
  if (changes.reset) forgetLines();

  for (const seq of changes.committed || []) remember(entry, seq);

  const reversed = [
    ...(changes.undone || []).map(seq => standing(seq, false)),
    ...(changes.redone || []).map(seq => standing(seq, true)),
  ];

  return reversed.length > 0 && reversed.every(Boolean) &&
    !r.error && !(changes.committed || []).length && !(r.output || []).length;
}

// ---- live listings --------------------------------------------------------

/*
  The newest listing keeps itself up to date.

  A listing is a question about the store, and the store changes under it: `mkdir x`
  in the next entry makes the answer above it wrong. Because the log says when it
  changed, the page can ask the question again — through `Refresh`, which re-reads and
  commits nothing — and replace the table in place. Only the newest listing does this;
  the ones above it froze when they scrolled out of the conversation, which is what a
  scrollback is for.
*/
let live = null;       // { entry, source, on } for the newest listing
let refreshWanted = false;

/// Which lines are worth keeping live: the two that ask what is there.
const listings = ['ls', 'find'];

function isListing(text) {
  return listings.includes(text.trim().split(/[\s|]/)[0]);
}

function markLive(entry, source) {
  if (live && live.entry !== entry) {
    const bar = live.entry.querySelector('.watch');
    if (bar) bar.innerHTML = '<span class="frozen">frozen</span>';
  }

  live = { entry, source, on: true };
  drawWatch();
}

function drawWatch() {
  if (!live) return;
  const bar = live.entry.querySelector('.watch');
  if (!bar) return;

  bar.innerHTML = `<button class="badge ${live.on ? 'on' : ''}">${live.on ? 'live' : 'paused'}</button>`;

  bar.querySelector('button').onclick = () => {
    live.on = !live.on;
    drawWatch();
    if (live.on) refreshLive();
  };
}

/// Asks the same question again and redraws the answer. A refusal or a failure leaves
/// what is on screen alone: a listing that has gone wrong is better than a blank one.
async function refreshLive() {
  refreshWanted = false;
  if (!live || !live.on || running || !ready) return;

  const target = live;

  try {
    const response = JSON.parse(await DotNet.invokeMethodAsync('WebClient', 'Refresh', target.source));
    if (response.error || live !== target) return;

    const tail = target.entry.querySelector('.tail');
    forgetTables(tail);
    tail.innerHTML = itemsHtml(response.result);

    // A table that changed while you were reading it has to say so, or the numbers
    // just quietly disagree with what you remember.
    tail.classList.remove('flash');
    void tail.offsetWidth;
    tail.classList.add('flash');
  } catch {
    // The runtime may be busy or gone. The next change asks again.
  }
}

// Called from .NET: while a command runs, with the complete current output lines, and
// after every commit, with the sequence number the store reached.
window.terminal = {
  output(id, lines) {
    if (!running || running.id !== id) return;
    running.entry.querySelector('.live').innerHTML = linesHtml(lines);
    scroll.scrollTop = scroll.scrollHeight;
  },

  // Raised from inside the commit, which is inside the call the page is still
  // awaiting, so the refresh is deferred rather than run here. A line finishing
  // refreshes too, which is what picks this up when it arrives mid-execution.
  storeChanged() {
    refreshWanted = true;
    if (!running) setTimeout(refreshLive, 0);
  }
};

// ---- the live input mirror ------------------------------------------------

let lineError = null;     // { column, end, sentence }: a parse error behind the word being typed

function refreshMirror() {
  const text = cmd.value;
  lineError = null;

  if (!ready || text.length === 0) {
    mirror.innerHTML = text.length ? escape(text) : '<span class="hint">type a command…</span>';
    return;
  }

  try {
    const parsed = JSON.parse(DotNet.invokeMethod('WebClient', 'Parse', text));

    if (!parsed.error) {
      mirror.innerHTML = tokenHtml(parsed.tokens);
    } else {
      // While a command is half-typed it is usually not valid yet, so an error at the
      // word being typed is expected, and shown by leaving the text plain. One that is
      // already behind that word will not go away by typing on, so it is marked.
      lineError = errorBehind(parsed.error, text, caretOf());
      mirror.innerHTML = lineError
        ? escape(text.slice(0, lineError.column)) +
          `<span class="bad">${escape(text.slice(lineError.column, lineError.end))}</span>` +
          escape(text.slice(lineError.end))
        : escape(text);
    }
  } catch {
    mirror.innerHTML = escape(text);
  }

  mirror.scrollLeft = cmd.scrollLeft;
}

const caretOf = () => cmd.selectionStart ?? cmd.value.length;

/// Where the word under the caret begins, found the way the core finds it: back to the
/// nearest whitespace, `|`, `(` or `,`, or to the quote an unclosed string opened with.
function wordStart(text, caret) {
  const before = text.slice(0, caret);
  if ((before.match(/"/g) || []).length % 2 === 1) return before.lastIndexOf('"');
  let start = caret;
  while (start > 0 && !/[\s|(,]/.test(text[start - 1])) start--;
  return start;
}

/// A parse error, when it is behind the word being typed: its column, the end of the
/// token it is at, and its sentence. A message without a position has nowhere to go.
function errorBehind(error, text, caret) {
  if (!error || (error.kind !== 'syntax' && error.kind !== 'lexical')) return null;
  const column = error.column;
  if (!(column >= 0 && column < wordStart(text, caret))) return null;

  let start = column, end = column + 1;
  if (/\s/.test(text[column])) {
    // The parser stopped at a gap: what it could not go on from is the token before it,
    // as in `echo a= b`, where `a=` has no value.
    while (start > 0 && !/\s/.test(text[start - 1])) start--;
    if (start < column) end = column;
  } else if (!/[|(),<>"]/.test(text[column])) {
    while (end < text.length && !/[\s|(),<>"]/.test(text[end])) end++;
  }
  return { column: start, end, sentence: errorSentence(error) };
}

/// The sentence a failed line shows for the same error. The core words it and sends
/// it with the parse, so what the detail line says while typing is what running the
/// line would say; the fallback is only for a response without one.
function errorSentence(error) {
  if (error.sentence) return error.sentence;
  if (error.explanation) return `Column ${error.column}: ${error.explanation}`;
  return `${error.kind === 'lexical' ? 'Lexical' : 'Syntax'} error at column ${error.column}.`;
}

// ---- completion -----------------------------------------------------------

// Asked asynchronously, because the core may run the stages before the cursor to
// learn what flows in (decision 0031). Every request is numbered and only the answer
// to the latest is drawn, so a slow answer to an old keystroke never replaces a new one.
let completionSeq = 0;
let completionPending = Promise.resolve();

let signature = null;    // the command the caret is in an argument of, when the core says
let answeredFor = null;  // { text, caret } the chips were asked for: their start and end count through it
let selected = 0;        // the chip whose detail is shown, and the one Tab puts in place
let showAll = false;     // whether the `+N` chip has been opened
let stepping = false;    // whether Tab now steps through the chips, filling having done all it can
let tabOrigin = null;    // { text, caret } before the first Tab of a run: what Escape puts back
let seen = null;         // { text, caret } the page last asked about or put there itself
let describeSeq = 0;     // taps are numbered too, so a typed key wins over a slow answer

/// Resolves once the answer to the latest request has been drawn. Waiting on the request
/// pending when a key was pressed is not enough: a newer one (a caret that moved) makes
/// its answer stale, it is dropped, and a Tab that ran then would find the old chips.
async function completionSettled() {
  let waited;
  do { waited = completionPending; await waited; } while (waited !== completionPending);
}

/// How many chips show before the rest fold into a `+N` chip.
const CHIP_LIMIT = 12;

/// Asks again for the line as it is now. Anything a person does to the line ends a run
/// of Tabs; the page's own filling passes `keepTab`, so Escape can still undo it.
function refreshCompletions(keepTab = false) {
  if (!keepTab) { tabOrigin = null; stepping = false; }
  seen ={ text: cmd.value, caret: caretOf() };
  completionPending = loadCompletions();
  return completionPending;
}

async function loadCompletions() {
  const seq = ++completionSeq;
  if (!ready || !cmd.value.length) {
    completions = []; signature = null; answeredFor = null; stepping = false;
    drawChips(); drawDetail();
    return;
  }

  const text = cmd.value;
  const cursor = caretOf();
  let items = [], sig = null;
  try {
    const response = JSON.parse(await DotNet.invokeMethodAsync('WebClient', 'Complete', text, cursor));
    items = response.items || [];
    sig = response.signature || null;
  } catch { items = []; }
  if (seq !== completionSeq) return;

  completions = items;
  signature = sig;
  answeredFor = { text, caret: cursor };
  selected = 0; showAll = false; stepping = false;

  // Nothing to offer when the word is already exactly the only completion.
  if (completions.length === 1 && text.slice(completions[0].start, completions[0].end) === completions[0].text) {
    completions = [];
  }

  drawChips(); drawDetail();
}

/// The chips: the first twelve, and a `+N` chip that opens the rest into the same row.
/// The selected one is marked, and kept in view as Tab steps along a row that scrolls.
function drawChips() {
  const row = $('complete');
  row.innerHTML = '';
  const shown = showAll ? completions.length : Math.min(completions.length, CHIP_LIMIT);

  completions.slice(0, shown).forEach((c, index) => {
    const b = document.createElement('button');
    b.className = `key ${c.kind}` + (index === selected ? ' sel' : '');
    b.textContent = c.text;
    b.onclick = () => applyCompletion(c);
    row.appendChild(b);
  });

  if (shown < completions.length) {
    const more = document.createElement('button');
    more.className = 'key more';
    more.textContent = `+${completions.length - shown}`;
    more.title = `${completions.length - shown} more`;
    // It opens the row rather than changing the line, so the caret stays where it was.
    more.onmousedown = e => e.preventDefault();
    more.onclick = () => { showAll = true; drawChips(); cmd.focus(); };
    row.appendChild(more);
  }

  // Scrolled by hand rather than with scrollIntoView, which may move the page too.
  const current = row.querySelector('.sel');
  if (current) {
    const left = current.offsetLeft - row.offsetLeft, right = left + current.offsetWidth;
    if (left < row.scrollLeft) row.scrollLeft = left;
    else if (right > row.scrollLeft + row.clientWidth) row.scrollLeft = right - row.clientWidth;
  }
}

/// The detail line, which does one job at a time, in this order: the signature while the
/// caret is in an argument; the selected chip's detail; a parse error already behind the
/// word being typed. Drawing it also drops the answer to a tap still on its way.
function drawDetail() {
  describeSeq++;
  const detail = $('detail');
  const chip = completions[selected];

  if (signature) detail.innerHTML = signatureHtml(signature);
  else if (chip && chip.detail) detail.innerHTML = `<b class="t ${chip.kind}">${escape(chip.text)}</b> · ${escape(chip.detail)}`;
  else if (lineError) detail.innerHTML = `<span class="problem">${escape(lineError.sentence)}</span>`;
  else detail.innerHTML = '';
}

/// `sort <column> [desc] [table] · The column to order by`: the parameter being written
/// is bold and its description follows; with none being written, the command's does.
function signatureHtml(sig) {
  const parameters = sig.parameters || [];
  const params = parameters.map((p, index) => {
    const shown = escape(p.optional ? `[${p.name}]` : `<${p.name}>`);
    return index === sig.active ? `<b class="param on">${shown}</b>` : `<span class="param">${shown}</span>`;
  }).join(' ');

  const active = sig.active != null ? parameters[sig.active] : null;
  const about = active ? active.description : sig.description;
  return `<span class="sig"><span class="t command">${escape(sig.command)}</span>${params ? ' ' + params : ''}</span>` +
         (about ? ` · ${escape(about)}` : '');
}

/// What a completion writes: a path is quoted when it needs to be.
function completionText(c) {
  const place = c.kind === 'folder' || c.kind === 'file' || c.kind === 'view';
  return place ? asWord(c.text) : c.text;
}

// A folder completes to `documents/` and stops there, so the next tap can go deeper;
// anything else is a whole word and gets its space. The core calls it `folder`: this
// said `directory`, so a folder was never coloured and always got a space. A
// completion replaces its word only, from `start` to `end`, so the rest of the line
// stays, and the caret lands after what was put in.
function applyCompletion(c, keepTab = false) {
  const text = completionText(c);
  // While Tab is stepping, the line holds a chip rather than what the chips were asked
  // for, and their start and end count through what they were asked for.
  const base = stepping && answeredFor ? answeredFor.text : cmd.value;
  const rest = base.slice(c.end);
  const trailing = (c.kind === 'folder' && text === c.text) || rest.startsWith(' ') ? '' : ' ';
  const inserted = text + trailing;
  cmd.value = base.slice(0, c.start) + inserted + rest;
  const caret = c.start + inserted.length;
  cmd.setSelectionRange(caret, caret);
  refreshMirror(); refreshCompletions(keepTab); cmd.focus();
}

/// Puts one chip in place while stepping: no space after it, and nothing asked again,
/// so the next Tab replaces it with the next chip.
function placeCompletion(c) {
  const base = answeredFor.text;
  const text = completionText(c);
  cmd.value = base.slice(0, c.start) + text + base.slice(c.end);
  const caret = c.start + text.length;
  cmd.setSelectionRange(caret, caret);
  seen = { text: cmd.value, caret };
  refreshMirror();
}

/*
  Tab fills the common prefix of the chips the first time, as shells do, and once
  filling does nothing more it steps through them, putting each in place in turn;
  Shift+Tab steps back. Escape puts back what was there before the first Tab.
*/
function tab(back) {
  if (!completions.length || !answeredFor) return;
  if (!tabOrigin) tabOrigin = { text: cmd.value, caret: caretOf() };

  if (!stepping && !back) {
    if (completions.length === 1) { applyCompletion(completions[0], true); return; }

    const first = completions[0];
    let prefix = first.text;
    for (const c of completions) while (!c.text.toLowerCase().startsWith(prefix.toLowerCase())) prefix = prefix.slice(0, -1);

    if (prefix.length > first.end - first.start) {
      const base = answeredFor.text;
      cmd.value = base.slice(0, first.start) + prefix + base.slice(first.end);
      const caret = first.start + prefix.length;
      cmd.setSelectionRange(caret, caret);
      refreshMirror(); refreshCompletions(true);
      return;
    }
  }

  const count = completions.length;
  if (!stepping) { stepping = true; selected = back ? count - 1 : 0; }
  else selected = (selected + (back ? count - 1 : 1)) % count;

  if (selected >= CHIP_LIMIT) showAll = true;
  placeCompletion(completions[selected]);
  drawChips(); drawDetail();
}

/// Escape: puts back what was there before the first Tab.
function untab() {
  if (!tabOrigin) return false;
  const origin = tabOrigin;
  cmd.value = origin.text;
  cmd.setSelectionRange(origin.caret, origin.caret);
  stepping = false;
  refreshMirror(); refreshCompletions();
  return true;
}

/// The caret moved without the text changing: a click, or an arrow key. The word under
/// it is a different word, so the chips are asked for again.
function caretMoved() {
  if (!ready || document.activeElement !== cmd || cmd.selectionStart !== cmd.selectionEnd) return;
  const now = { text: cmd.value, caret: caretOf() };
  if (!seen || now.text !== seen.text || now.caret === seen.caret) return;
  stepping = false;
  refreshMirror(); refreshCompletions();
}

// ---- executing ------------------------------------------------------------

async function run() {
  if (running) { stop(); return; }

  const text = cmd.value.trim();
  if (!ready || !text) return;

  // Handled by the page rather than the evaluator, because it is about the screen
  // rather than about the filesystem. `undo` used to be here too, and `help` until
  // Phase 3; both are real commands now, so they go through the evaluator like
  // everything else and can be piped.
  if (text === 'clear') {
    scroll.innerHTML = ''; tables.clear(); committedBy.clear(); live = null; afterRun(text); return;
  }

  const id = nextId++;
  running = { id, entry: startEntry(id, text) };
  runButton.textContent = 'Stop'; runButton.classList.add('stop');
  afterRun(text);

  const entry = running.entry;

  try {
    const response = await DotNet.invokeMethodAsync('WebClient', 'Execute', text, id);
    const result = JSON.parse(response);
    refreshStatus();

    if (applyChanges(entry, result)) {
      // An undo or a redo that did what it was asked to the screen already: the entry
      // it reversed has gone or come back, and it leaves nothing of its own.
      entry.remove();
    } else {
      finishEntry(entry, result);

      // The newest listing is the one kept live, and only when it answered a table:
      // a failed `ls` has nothing to keep up to date.
      if (!result.error && isListing(text) && (result.result || []).some(item => item.kind === 'table')) {
        markLive(entry, text);
      }
    }
  } catch (e) {
    entry.classList.remove('running');
    entry.querySelector('.tail').innerHTML = `<div class="err">${escape(String(e))}</div>`;
  } finally {
    running = null;
    // Which run finished last. An undo can leave no entry, so this, not a count of
    // entries, is how the browser check knows a line is done.
    document.body.dataset.finished = id;
    runButton.textContent = 'Run'; runButton.classList.remove('stop');
    await refreshPrompt();

    // A commit raised `storeChanged` while this line was still running, so the
    // refresh it asked for happens now that nothing is in flight.
    if (refreshWanted) await refreshLive();

    cmd.focus();
  }
}

function stop() {
  if (!running) return;
  try { DotNet.invokeMethod('WebClient', 'Cancel'); } catch {}
}

function afterRun(text) {
  if (history[history.length - 1] !== text) history.push(text);
  historyIndex = -1; draft = '';
  cmd.value = '';
  refreshMirror(); refreshCompletions();
}

/*
  Where you are, the one way out of it, and the two ways back through what you did.

  A listing is a table of records from Phase 3, and a table has nowhere to put the `up`
  entry that used to head one: every row is a record, and `up` is not. It lives here
  instead, beside the folder it would take you out of, and it runs the `up` command.

  From Phase 4 there are two ways of being somewhere. A folder reads as its path; a
  view reads as the question it is, with the folder it was entered from behind it,
  because that is still where a new file would land. `up` leaves the view first and the
  folder second, in the order they were entered.

  Undo and redo sit before it and are there everywhere, the root included: there is
  always a last line to take back. They run the `undo` and `redo` commands, so what
  they do is exactly what typing them does, entry hidden and brought back included.
*/
async function refreshPrompt() {
  if (!ready) return;
  const location = JSON.parse(DotNet.invokeMethod('WebClient', 'Location'));

  const where = location.view
    ? `<span class="viewing">view:</span> <span class="predicate">${escape(location.view)}</span>` +
      `<span class="inside"> in ${escape(location.folder)}</span>`
    : escape(location.folder);

  const canGoUp = !!location.view || location.folder !== '/';

  $('prompt').innerHTML =
    '<button class="step" id="undo" title="undo" aria-label="undo">\u21B6</button>' +
    '<button class="step" id="redo" title="redo" aria-label="redo">\u21B7</button>' +
    (canGoUp ? '<button class="up" id="up">up</button> ' : ' ') +
    `<span id="where">${where}</span>`;

  $('undo').onclick = () => press('undo');
  $('redo').onclick = () => press('redo');
  if (canGoUp) $('up').onclick = () => press('up');
}

/// Runs a button as the line it stands for, and puts back whatever was being typed:
/// tapping undo half way through writing a line should not cost you the line.
async function press(line) {
  if (running || !ready) return;
  const typed = cmd.value;
  cmd.value = line;
  await run();
  if (!cmd.value && typed) { cmd.value = typed; refreshMirror(); refreshCompletions(); }
}

// ---- input handling -------------------------------------------------------

cmd.addEventListener('input', () => { refreshMirror(); refreshCompletions(); });
cmd.addEventListener('scroll', () => { mirror.scrollLeft = cmd.scrollLeft; });

cmd.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); run(); return; }
  if (e.key === 'Escape' && running) { e.preventDefault(); stop(); return; }

  // Walk back through what has already been run.
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!history.length) return;
    if (historyIndex === -1) { draft = cmd.value; historyIndex = history.length; }
    historyIndex = Math.max(0, historyIndex - 1);
    cmd.value = history[historyIndex];
    refreshMirror(); refreshCompletions();
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex === -1) return;
    historyIndex++;
    if (historyIndex >= history.length) { historyIndex = -1; cmd.value = draft; }
    else cmd.value = history[historyIndex];
    refreshMirror(); refreshCompletions();
    return;
  }

  // Tab takes the only completion, or the common prefix of several, and after that
  // steps through them. It waits for the answer to the last keystroke first, which may
  // still be on its way.
  if (e.key === 'Tab') {
    e.preventDefault();
    const back = e.shiftKey;
    completionSettled().then(() => tab(back));
    return;
  }

  // Escape puts back what was typed before Tab changed it. While a command runs it
  // stops the command instead, above.
  if (e.key === 'Escape' && tabOrigin) { e.preventDefault(); untab(); }
});

// The caret can move without the text changing, and then it is in a different word.
// `selectionchange` says so where the browser raises it for an input; the key and the
// click are there for where it does not. Each asks only when the caret really moved.
document.addEventListener('selectionchange', caretMoved);
cmd.addEventListener('keyup', e => {
  if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) caretMoved();
});
cmd.addEventListener('click', caretMoved);

/*
  Tapping a token says what it means where it stands: what a variable holds, what a
  command takes, what type a column is, what an operator compares. The core answers,
  from the line the token is in, read the way completion reads it. Where it has nothing
  to say, the token's grammar role is shown, as it always was.
*/
/// Where to ask about a token: the end of the word it is part of, so the core reads the
/// whole word. The tokens keep a sigil apart from what follows it (`$` `row` `.` `kind`,
/// `-` `desc`, `"` `my notes.txt` `"`), so a sigil is asked about at the end of the
/// token after it, and a string's closing quote from inside the quote.
function tokenOffset(token) {
  const end = Number(token.dataset.end);
  const text = token.dataset.text || '';
  const next = token.nextElementSibling;
  const adjacent = next && next.classList.contains('t') &&
    Number(next.dataset.end) - (next.dataset.text || '').length === end ? next : null;

  if (token.dataset.kind === 'string' && text === '"') {
    return adjacent && adjacent.dataset.kind === 'string' && adjacent.dataset.text !== '"'
      ? Number(adjacent.dataset.end)
      : end - 1;
  }
  if ((text === '$' || text === '.' || text === '-') && adjacent) return Number(adjacent.dataset.end);
  return end;
}

async function describeToken(token) {
  const kind = token.dataset.kind, text = token.dataset.text || '';
  const role = `<b class="t ${kind}">${escape(kind)}</b> — ${escape(text)}`;
  const echo = token.closest('.echo');
  const source = echo ? echo.dataset.source : '';

  const seq = ++describeSeq;
  if (!source || kind === 'punctuation') { $('detail').innerHTML = role; return; }

  let hover = null;
  try { hover = JSON.parse(await DotNet.invokeMethodAsync('WebClient', 'Describe', source, tokenOffset(token))); } catch {}
  if (seq !== describeSeq) return;

  $('detail').innerHTML =
    !hover ? role
    : hover.signature ? signatureHtml(hover.signature)
    : `<b class="t ${kind}">${escape(hover.text)}</b>` + (hover.detail ? ` · ${escape(hover.detail)}` : ` — ${escape(kind)}`);
}

// Tapping a token says what it is; tapping a result inserts it.
document.addEventListener('click', e => {
  const token = e.target.closest('.echo .t');
  if (token) {
    document.querySelectorAll('.t.sel').forEach(el => el.classList.remove('sel'));
    token.classList.add('sel');
    describeToken(token);
    return;
  }

  // A header re-sorts what is on screen; it does not run anything.
  const header = e.target.closest('.grid th');
  if (header) {
    const grid = header.closest('.grid');
    const id = Number(grid.dataset.table);
    const table = tables.get(id);
    const column = Number(header.dataset.column);

    if (table.sort === column) table.desc = !table.desc;
    else { table.sort = column; table.desc = false; }

    grid.innerHTML = gridHtml(id);
    return;
  }

  const cell = e.target.closest('.grid td');
  if (cell) {
    insert(cell.dataset.insert);
    return;
  }

  const item = e.target.closest('.item');
  if (item) {
    insert(item.dataset.insert);
  }
});

/// Appends to the line being typed, with a space before it if something is there.
function insert(text) {
  if (!text) return;
  cmd.value = (cmd.value ? cmd.value.replace(/\s*$/, ' ') : '') + text;
  refreshMirror(); refreshCompletions();
  cmd.focus();
}

runButton.onclick = run;

[['help','help'],['ls','ls'],['where','ls | where $row.kind eq folder'],
 ['sort','ls | sort size desc'],['select','ls | select name kind'],['count','ls | count'],
 ['first','ls | sort name | first'],['run','run examples/tables.clr'],
 ['run journal','run examples/journal.clr'],['run resilient','run examples/resilient.clr'],
 ['else','cat missing.txt else echo "none"'],['try','try cat missing.txt | set problem'],
 ['$problem.kind','echo $problem.kind'],['??','first (ls | where $row.kind eq view) ?? "no views"'],
 ['find','find $row.kind eq folder'],['cd a view','cd $row.kind eq folder'],
 ['save-view','save-view folders $row.kind eq folder'],['up','up'],

 // `reset` is deliberately absent: it is the one command that cannot be undone, and a

  .forEach(([label, value]) => {
    const b = document.createElement('button');
    b.className = 'key'; b.innerHTML = label;
    b.onclick = () => {
      cmd.value = value; refreshMirror(); refreshCompletions(); cmd.focus();
    };
    $('keys').appendChild(b);

/// What the banner says depends on whether this is a first visit, a restored one, or a
/// session that will not be kept. Saying "nothing is sent anywhere" matters more once
/// something is being stored, so that is where it is said.
function bannerFor(store) {
  const common =
    'The parser, the commands and the filesystem are all .NET compiled to WebAssembly. ' +
    'Type <b>help</b> for the commands, or tap a suggestion below. ' +
    'Listings are tables you can question: <b>ls | where $row.kind eq folder | count</b>. ' +
    'A question is also somewhere you can be: <b>cd $row.kind eq folder</b> enters it, ' +
    '<b>ls</b> lists it across folders, <b>up</b> leaves it, <b>find</b> asks it once ' +
    'and <b>save-view</b> keeps it as a file. A failure is a value too: ' +
    '<b>cat missing.txt else echo "none"</b> recovers, <b>try cat missing.txt | set problem</b> ' +
    'keeps the fault to read as <b>$problem.kind</b>, and <b>??</b> gives a default for nothing. ' +
    'The newest listing stays live as the ' +
    'filesystem changes; tap <b>live</b> under it to stop. ' +
    'Also pipes, the function form (write(notes.txt, hello)), tags (&lt;thing a=1/&gt;), ' +
    'components ({renderer/}) and variables (set v 5, then $v). ' +
    'Tap a column header to re-sort what is on screen, or a cell to insert it. ' +
    '<b>clear</b> empties the screen; <b>undo</b>, <b>redo</b> and <b>history</b> are commands.';

  if (!store.persistent) {
    return 'A terminal running in this tab. ' + common +
           ' This browser is not keeping the log, so everything here disappears when the tab does.';
  }

  if (store.replayed > 0) {
    return `Restored ${store.replayed} line(s) from last time. ` + common +
           ' Your files live in this browser, and are not sent anywhere.';
  }

  return 'A terminal running in this tab. ' + common +
         ' Your files are kept in this browser between visits, and are not sent anywhere.';
}

// ---- boot -----------------------------------------------------------------

(function waitForRuntime(attempt) {
  if (window.DotNet && typeof DotNet.invokeMethod === 'function') {
    try {
      DotNet.invokeMethod('WebClient', 'Parse', '');
    } catch {
      if (attempt < 400) return setTimeout(() => waitForRuntime(attempt + 1), 100);
    }

    // Replaying the log is asynchronous, and nothing may run until it has finished:
    // an empty filesystem looks exactly like a lost one. Today it returns at once;
    // in Phase 2 it reads IndexedDB, and the wait is already in the right place.
    $('status').innerHTML = '<span style="color:var(--dim)">restoring…</span>';

    DotNet.invokeMethodAsync('WebClient', 'Initialize')
      .then(status => finishBoot(JSON.parse(status)))
      .catch(e => {
        // The message matters: a session that cannot restore is showing the user an
        // empty filesystem that may not be empty, and "failed" alone says nothing about
        // whether their files are gone or the code is broken.
        $('status').innerHTML = '<span style="color:var(--bad)">failed to restore</span>';
        addEntry(`<div class="err">Could not restore the session: ${escape(String(e && e.message || e))}</div>`);
      });
    return;
  }

  if (attempt < 400) setTimeout(() => waitForRuntime(attempt + 1), 100);
  else $('status').innerHTML = '<span style="color:var(--bad)">failed to load</span>';
})(0);

/*
  Storage can stop answering mid-session, when site data is cleared with the page open.
  The log falls back to memory at once; this is how the page finds out, after every
  line, so `not persisted` appears when it becomes true rather than only at load.
*/
function refreshStatus() {
  let store;
  try { store = JSON.parse(DotNet.invokeMethod('WebClient', 'Status')); } catch { return; }
  if (!store.persistent && !$('status').querySelector('.warn')) showStatus(store);
}

function showStatus(store) {
  $('status').innerHTML = store.persistent
    ? '<span style="color:var(--ok)">wasm</span>'
    : '<span style="color:var(--ok)">wasm</span> <span class="warn" title="' +
      escape(store.reason || 'This browser is not keeping the log.') +
      '">not persisted</span>';
}

function finishBoot(store) {
    ready = true;
    cmd.disabled = false; runButton.disabled = false;

    // `not persisted` is said up front, before anything is typed. Finding out after a
    // morning's work that none of it was being kept would be the worst moment to learn
    // it, and a private window is the common case rather than a broken one.
    showStatus(store);

    $('banner').innerHTML = bannerFor(store);

    if (store.unreadable > 0) {
      addEntry(`<div class="err">${store.unreadable} stored line(s) could not be read and were skipped. ` +
               `<b>reset</b> starts over.</div>`);
    }

    refreshPrompt();
    refreshMirror();
    cmd.focus();
}

refreshMirror();

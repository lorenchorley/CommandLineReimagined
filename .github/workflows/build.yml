name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  linux:
    name: Libraries and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # global.json asks for 10.0.100 or newer in the same feature band.
          dotnet-version: 10.0.x

      # Both languages: the core and the parser are F# projects, and leaving the
      # glob at *.csproj would have built everything that depends on the core
      # without ever building the core's own tests. WebClient is left to the wasm
      # job, which needs a workload this one does not install.
      - name: Build libraries
        run: |
          for proj in $(find . \( -name '*.csproj' -o -name '*.fsproj' \) -not -name 'WebClient.csproj' | sort); do
            echo "::group::$proj"
            dotnet build "$proj" -c Release
            echo "::endgroup::"
          done

      - name: Test
        run: |
          for proj in $(find . \( -name '*.Tests.csproj' -o -name '*.Tests.fsproj' \) | sort); do
            echo "::group::$proj"
            dotnet test "$proj" -c Release --no-build
            echo "::endgroup::"
          done

      # The log's storage module, against a real IndexedDB implementation rather than
      # a browser. It runs in a second, and its job is mostly failure behaviour that a
      # browser makes awkward to arrange: a private window, storage that goes away.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the store module
        run: |
          npm install --prefix tools --no-audit --no-fund
          node tools/store-check.mjs

  wasm:
    name: WebAssembly client (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # global.json asks for 10.0.100 or newer in the same feature band.
          dotnet-version: 10.0.x

      # Built separately from the loop above because it needs the wasm-tools
      # workload, and because publish (not build) is what actually exercises
      # trimming -- which is where a reflection-dependent parser would break.
      - name: Install wasm-tools
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish WebClient/WebClient.csproj -c Release -o wasm-publish

      - name: Check payload
        run: |
          set -euo pipefail
          cd wasm-publish/wwwroot
          find . \( -name '*.gz' -o -name '*.br' \) -delete
          bytes=$(du -sb . | cut -f1)
          files=$(find . -type f | wc -l)
          echo "payload: $((bytes / 1048576)) MB across $files files"
          # A ceiling on the browser download. Something that drags a large
          # dependency or embedded data into the client shows up here first.
          [ "$bytes" -lt 20971520 ] || { echo "payload over 20 MB; what was added to the client?"; exit 1; }

      # Handed to the browser job as it was measured, rather than published twice:
      # the page that is checked is the one whose size was just checked.
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-publish
          path: wasm-publish/wwwroot
          retention-days: 1

  browser:
    name: Browser check (Linux)
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm-publish
          path: wasm-publish/wwwroot

      # The test suites prove the core; this proves the page. It is the only check
      # that runs the published client in a browser, so it is the only one that can
      # catch a stale interop name, a renderer that drops a field, a console error
      # nobody sees, or a chip too small to tap. It runs all four example programs
      # against their golden results, and reloads to prove the log came back.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --prefix tools --no-audit --no-fund
          ./tools/node_modules/.bin/playwright install --with-deps chromium

      - name: Check the page in a browser
        run: node tools/browser-check.mjs wasm-publish/wwwroot
